[workspace]
members = [
    "crates/pagebridge-core",
    "crates/pagebridge-adapter-postgres",
    "crates/pagebridge-adapter-sqlite",
    "crates/pagebridge-adapter-mongodb",
    "crates/pagebridge-adapter-embedded",
    "crates/pagebridge-adapter-jsonfile",
    "crates/pagebridge-adapter-mysql",
    "crates/pagebridge-adapter-mssql",
    "crates/pagebridge-adapter-oracle",
    "crates/pagebridge-adapter-cockroach",
    "crates/pagebridge-adapter-yugabyte",
    "crates/pagebridge-adapter-spanner",
    "crates/pagebridge-adapter-tidb",
    "crates/pagebridge-adapter-cassandra",
    "crates/pagebridge-adapter-scylla",
    "crates/pagebridge-adapter-clickhouse",
    "crates/pagebridge-adapter-duckdb",
    "crates/pagebridge-adapter-timescale",
    "crates/pagebridge-adapter-snowflake",
    "crates/pagebridge-adapter-bigquery",
    "crates/pagebridge-adapter-redshift",
    "crates/pagebridge-adapter-databricks",
    "crates/pagebridge-adapter-lmdb",
    "crates/pagebridge-adapter-rocksdb",
    "crates/pagebridge-adapter-sled",
    "crates/pagebridge-adapter-fjall",
    "crates/pagebridge-adapter-arango",
    "crates/pagebridge-adapter-surrealdb",
    "crates/pagebridge-adapter-foundationdb",
    "crates/pagebridge-adapter-redis",
    "crates/pagebridge-adapter-odbc",
    "crates/pagebridge-llm-ollama",
    "crates/pagebridge-llm-openai",
    "crates/pagebridge-llm-anthropic",
    "crates/pagebridge-llm-llamacpp",
    "crates/pagebridge-admin",
    "crates/pagebridge-mcp",
    "crates/pagebridge-obs",
    "crates/pagebridge-auth",
    "crates/pagebridge-vision",
    "crates/pagebridge-links",
    "crates/pagebridge-eval",
    "crates/pagebridge-plugin-abi",
    "crates/pagebridge-audit",
    "crates/pagebridge-receipt",
    "crates/pagebridge-deterministic",
    "crates/pagebridge-timetravel",
    "crates/pagebridge-reranker",
    "crates/pagebridge-llm-routing",
    "crates/pagebridge-llm-cost",
    "crates/pagebridge-llm-gemini",
    "crates/pagebridge-llm-bedrock",
    "crates/pagebridge-llm-cohere",
    "crates/pagebridge-llm-mlx",
    "crates/pagebridge-slo",
    "crates/pagebridge-quality",
    "crates/pagebridge-build",
    "crates/pagebridge-sensitivity",
    "crates/pagebridge-tenant",
    "crates/pagebridge-injection",
    "crates/pagebridge-hotreload",
    "crates/pagebridge-federation",
    "crates/pagebridge-budget",
    "crates/pagebridge",
    "crates/pagebridge-py",
    "crates/pagebridge-cli",
]
resolver = "2"

[workspace.package]
version = "1.6.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Mohamed Yasser <yasserrmd@users.noreply.github.com>"]
repository = "https://github.com/pagebridge/pagebridge"
description = "Cognitive retrieval for the database you already have"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Hashing
sha2 = "0.10"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# Tokenization
unicode-segmentation = "1.11"
rust-stemmers = "1.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Concurrency
parking_lot = "0.12"
dashmap = "6.1"
crossbeam-utils = "0.8"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }

# Storage adapters
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "macros", "chrono", "json"] }
mongodb = "3.1"
redb = "2.2"
tantivy = "0.22"
memmap2 = "0.9"
mysql_async = { version = "0.34", default-features = false, features = ["minimal-rust", "rustls-tls"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "chrono", "rust_decimal"] }
bb8 = "0.8"
bb8-tiberius = "0.15"
tokio-util = { version = "0.7", features = ["compat"] }
oracle = { version = "0.6", default-features = false }
llama-cpp-2 = { version = "0.1", default-features = false }
axum = { version = "0.7", features = ["macros", "ws", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
prometheus = { version = "0.13", default-features = false }
biscuit-auth = { version = "6.0", features = ["datalog-macro"] }
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"
regex = "1.11"
csv = "1.3"

# PDF
pdf-extract = "0.7"

# Dev
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3.10"
proptest = "1.5"
rand = "0.8"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "mongo", "mariadb"] }
wiremock = "0.6"

# Workspace internal
pagebridge-core = { path = "crates/pagebridge-core", version = "1.6.0" }
pagebridge-adapter-postgres = { path = "crates/pagebridge-adapter-postgres", version = "1.6.0" }
pagebridge-adapter-sqlite = { path = "crates/pagebridge-adapter-sqlite", version = "1.6.0" }
pagebridge-adapter-mongodb = { path = "crates/pagebridge-adapter-mongodb", version = "1.6.0" }
pagebridge-adapter-embedded = { path = "crates/pagebridge-adapter-embedded", version = "1.6.0" }
pagebridge-adapter-jsonfile = { path = "crates/pagebridge-adapter-jsonfile", version = "1.6.0" }
pagebridge-adapter-mysql = { path = "crates/pagebridge-adapter-mysql", version = "1.6.0" }
pagebridge-adapter-mssql = { path = "crates/pagebridge-adapter-mssql", version = "1.6.0" }
pagebridge-adapter-oracle = { path = "crates/pagebridge-adapter-oracle", version = "1.6.0" }
pagebridge-adapter-cockroach = { path = "crates/pagebridge-adapter-cockroach", version = "1.6.0" }
pagebridge-adapter-yugabyte = { path = "crates/pagebridge-adapter-yugabyte", version = "1.6.0" }
pagebridge-adapter-spanner = { path = "crates/pagebridge-adapter-spanner", version = "1.6.0" }
pagebridge-adapter-tidb = { path = "crates/pagebridge-adapter-tidb", version = "1.6.0" }
pagebridge-adapter-cassandra = { path = "crates/pagebridge-adapter-cassandra", version = "1.6.0" }
