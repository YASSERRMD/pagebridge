[package]
name = "pagebridge-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pagebridge-core = { path = "../crates/pagebridge-core" }

[[bin]]
name = "node_id_parser"
path = "fuzz_targets/node_id_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "doc_id_parser"
path = "fuzz_targets/doc_id_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "summary_cache_json"
path = "fuzz_targets/summary_cache_json.rs"
test = false
doc = false
bench = false

[workspace]
