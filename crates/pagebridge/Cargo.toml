[package]
name = "pagebridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cognitive retrieval for the database you already have. Umbrella crate."

[dependencies]
pagebridge-core.workspace = true
pagebridge-adapter-postgres = { workspace = true, optional = true }
pagebridge-adapter-sqlite = { workspace = true, optional = true }
pagebridge-adapter-mongodb = { workspace = true, optional = true }
pagebridge-adapter-embedded = { workspace = true, optional = true }
pagebridge-adapter-jsonfile = { workspace = true, optional = true }
pagebridge-adapter-mysql = { workspace = true, optional = true }
pagebridge-adapter-mssql = { workspace = true, optional = true }
pagebridge-adapter-oracle = { workspace = true, optional = true }
pagebridge-llm-ollama = { workspace = true, optional = true }
pagebridge-llm-openai = { workspace = true, optional = true }
pagebridge-llm-anthropic = { workspace = true, optional = true }

[features]
default = ["sqlite", "embedded", "jsonfile", "ollama", "openai"]
postgres = ["dep:pagebridge-adapter-postgres"]
sqlite = ["dep:pagebridge-adapter-sqlite"]
mongodb = ["dep:pagebridge-adapter-mongodb"]
embedded = ["dep:pagebridge-adapter-embedded"]
jsonfile = ["dep:pagebridge-adapter-jsonfile"]
mysql = ["dep:pagebridge-adapter-mysql"]
mssql = ["dep:pagebridge-adapter-mssql"]
oracle = ["dep:pagebridge-adapter-oracle"]
oracle-driver = ["oracle", "pagebridge-adapter-oracle/oracle-driver"]
ollama = ["dep:pagebridge-llm-ollama"]
openai = ["dep:pagebridge-llm-openai"]
anthropic = ["dep:pagebridge-llm-anthropic"]
all-adapters = ["postgres", "sqlite", "mongodb", "embedded", "jsonfile", "mysql", "mssql", "oracle"]
all-llms = ["ollama", "openai", "anthropic"]
full = ["all-adapters", "all-llms"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow.workspace = true
serde_json.workspace = true

[[example]]
name = "quickstart"
path = "examples/quickstart.rs"

[lints]
workspace = true
