[package]
name = "pagebridge-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Python bindings for pagebridge"

[lib]
name = "_pagebridge"
# Only `cdylib` so pyo3's `extension-module` feature can suppress libpython
# linkage. The `rlib` form would force a Python-symbol link at build time,
# which fails on CI runners that don't ship a python-config-discoverable
# libpython (e.g. macos-latest GitHub Actions).
crate-type = ["cdylib"]

[dependencies]
pagebridge = { workspace = true, features = ["sqlite", "embedded", "jsonfile", "ollama", "openai", "anthropic"] }
pagebridge-core.workspace = true
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
