[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pagebridge"
version = "0.1.0"
description = "Cognitive retrieval for the database you already have"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [
  { name = "Mohamed Yasser" },
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "pagebridge._pagebridge"
python-source = "python"
