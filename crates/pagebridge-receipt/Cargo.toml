[package]
name = "pagebridge-receipt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Verifiable Answer Receipts for pagebridge (cryptographically tamper-evident retrieval responses)"

[dependencies]
pagebridge-core.workspace = true
pagebridge-audit.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
ed25519-dalek = { version = "2.1", features = ["pkcs8"] }
ulid = { version = "1.1", features = ["serde"] }
tracing.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt", "fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true

[lints]
workspace = true
