[package]
name = "pagebridge-audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tamper-evident audit log for pagebridge (HIPAA/GDPR/SOX-grade per-retrieval logging)"

[dependencies]
pagebridge-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt", "fs", "io-util"] }
hex.workspace = true
ulid = { version = "1.1", features = ["serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8"] }
rand.workspace = true
reqwest = { workspace = true, optional = true }

[features]
default = []
http-sinks = ["dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true

[lints]
workspace = true
