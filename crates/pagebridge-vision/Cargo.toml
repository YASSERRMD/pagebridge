[package]
name = "pagebridge-vision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Vision-mode PDF ingestion helpers for pagebridge"

[features]
default = []
# Enable real PDF page rasterization. Requires pdfium-render and the pdfium
# shared library on the build host. Off by default to keep the workspace
# buildable without native deps.
rasterize = []

[dependencies]
pagebridge-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
